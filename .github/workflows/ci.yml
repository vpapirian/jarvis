name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Only what the tests import; audio/TTS/Whisper packages need system
      # libraries and are not used by the unit tests.
      - run: pip install anthropic python-dotenv pytest
      - run: python -m pytest -q
